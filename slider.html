<!DOCTYPE html>
<html>
    <body>
        <center>
       <h1>Flowers at its best</h1>
        <section>
            <img class="mySlides" src="flower 1.png" style="height: 500px;">
            <img class="mySlides" src="flower 2.jpeg" style="height: 500px;">
            <img class="mySlides" src="flower 3.png" style="height: 500px;">
            <img class="mySlides" src="flower 4.jpg" style="height: 500px;">
            <img class="mySlides" src="flower 5.jpg" style="height: 500px;">
        </section>
        </center>
        <script>
            var myIndex = 0;
            carousel();

            function carousel() {
            var i;
            var x = document.getElementsByClassName("mySlides");
            for (i = 0; i < x.length; i++) {
              x[i].style.display = "none";
            }
            myIndex++;
            if (myIndex > x.length) {myIndex = 1}
            x[myIndex-1].style.display = "block";
            setTimeout(carousel, 3000);
            }
        </script>
    </body>
</html>
